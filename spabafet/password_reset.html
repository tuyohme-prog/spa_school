<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Reset - Spabafet School</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .reset-container {
      background: #111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid green;
      width: 350px;
      box-shadow: 0px 0px 15px yellowgreen;
    }

    h2 {
      text-align: center;
      color: yellowgreen;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: yellowgreen;
      border: none;
      border-radius: 6px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: green;
      color: white;
    }

    .back-link {
      text-align: center;
      margin-top: 15px;
    }

    .back-link a {
      color: yellowgreen;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <h2>Password Reset</h2>
    <form action="#" method="post">
      <label for="user">Enter Email or Registration Number:</label>
      <input type="text" id="user" name="user" placeholder="e.g. john@example.com" required>

      <button type="submit">Send Reset Link</button>
    </form>

    <div class="back-link">
      <p><a href="portal_log_in.html">Back to Login</a></p>
    </div>
  </div>
</body>
</html>
