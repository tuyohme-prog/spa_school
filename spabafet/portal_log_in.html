<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      width: 350px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #203a43;
    }

    .login-box label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
      color: #333;
    }

    .login-box input, 
    .login-box select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .login-box button {
      width: 100%;
      padding: 10px;
      background: #203a43;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .login-box button:hover {
      background: #2c5364;
    }

    .login-box p {
      text-align: center;
      margin-top: 15px;
    }

    .login-box a {
      color: #203a43;
      text-decoration: none;
    }

    .login-box a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Portal Login</h2>
    <form>
      <label for="portal">Select Portal</label>
      <select id="portal" name="portal" required>
        <option value="">-- Choose Portal --</option>
        <option value="student">Student Portal</option>
        <option value="staff">Staff Portal</option>
      </select>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter password" required>

      <button type="submit">Login</button>

      <p><a href="passwordreset.html">Forgot Password?</a></p>
    </form>
  </div>

  <script>
    // Get portal from URL if provided (e.g. login.html?portal=student)
    const urlParams = new URLSearchParams(window.location.search);
    const portal = urlParams.get('portal');
    if (portal) {
      document.getElementById("portal").value = portal;
    }
  </script>
</body>
</html>
