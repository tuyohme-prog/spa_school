<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bursar Secret Portal</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    h1 {
      color: yellowgreen;
    }

    .hidden {
      display: none;
    }

    form {
      background: #111;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: 20px auto;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 8px;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: none;
      border-radius: 5px;
    }

    button {
      background: yellowgreen;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: green;
      color: white;
    }
  </style>
</head>
<body>
  <h1>Bursar Secret Portal</h1>

  <!-- Password Form -->
  <div id="login-box">
    <p><strong>Enter Password to Access</strong></p>
    <input type="password" id="password" placeholder="Enter password">
    <button onclick="checkPassword()">Login</button>
    <p id="error" style="color: red;"></p>
  </div>

  <!-- Hidden Portal -->
  <div id="portal" class="hidden">
    <form>
      <h2>Pay Staff</h2>
      <label for="staff">Select Staff:</label>
      <select id="staff">
        <option>Teacher 1</option>
        <option>Teacher 2</option>
        <option>Non-Teaching Staff</option>
        <option>Principal</option>
      </select>

      <label for="amount">Enter Amount:</label>
      <input type="number" id="amount" placeholder="e.g. 50000">

      <label for="month">Month:</label>
      <input type="text" id="month" placeholder="e.g. September 2025">

      <button type="submit">Pay Now</button>
    </form>
  </div>

  <script>
    function checkPassword() {
      const password = document.getElementById("password").value;
      const correctPassword = "spabafet123"; // 🔑 change this to your own

      if (password === correctPassword) {
        document.getElementById("login-box").style.display = "none";
        document.getElementById("portal").classList.remove("hidden");
      } else {
        document.getElementById("error").innerText = "Incorrect Password!";
      }
    }
  </script>
</body>
</html>
